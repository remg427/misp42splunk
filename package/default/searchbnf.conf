##################
# mispgetioc
##################
[mispgetioc-command]
syntax = | mispgetioc <mispgetioc-options> 
shortdesc = Retrieve attributes of matching events in MISP instance. Must provide either option "json_request", "date", "eventid", "last", "publish_timestamp" or "timestamp".
description = mispgetioc searches for matching attributes in MISP instance.\
  You can filter on "category" or "type" of attributes, on attributes having the "to_ids" flag set\
  or specific "tags" or not having tags "not_tags".\
usage = public
example1 = | mispgetioc misp_instance=misp last=10d limit=0
comment1 = Retrieve attributes of all events published in last 10 days.
example2 = | mispgetioc misp_instance=misp date="2023-01-01,2023-01-31" category="Payload delivery,Network%" type=ip-dst to_ids=TRUE
comment2 = Retrieve up to first 1000 (default limit) attributes from events having event date set between 2023-01-01 and 2023-01-31, attributes of type 'ip-dst', and categories 'Payload delivery' or starting with 'Network' and with the flag "to_ids" set.
related = mispgetevent, mispfetch, mispsearch
tags = misp

[mispgetioc-options]
syntax = misp_instance=<string> json_request=<JSON> date=<YYYY-MM-DD[,YYYY-MM-DD]> eventid=<id1,id2,...> \
  last=<int>d|h|m publish_timestamp=<int>d|h|m timestamp=<int>d|h|m \
  category=<CSV string> decay_score_threshold=<int> decaying_model=<int> exclude_decayed=<bool> expand_object=<bool> \
  geteventtag=<bool> include_decay_score=<bool> include_deleted=<bool> include_sightings=<bool> limit=<int> \
  not_tags=<CSV string> output=<fields|json> page=<int> pipesplit=<bool> prefix=<string> tags=<CSV string> \
  threat_level_id=<int> to_ids=<bool> type=<CSV string> warning_list=<bool>


##################
# mispgetevent
##################
[mispgetevent-command]
syntax = | mispgetevent <mispgetevent-options> 
shortdesc = Retrieve events from MISP instance. Must provide either option "json_request", "date", "eventid", "last", "publish_timestamp" or "timestamp".
description = mispgetevent searches in MISP instance for matching events.\
  You can filter on "category" or "type" of attributes, or specific "tags" or "not_tags".\
  Use getioc=true to return attribute values with each event.
usage = public
example1 = | mispgetevent misp_instance=misp timestamp=10d
comment1 = Retrieve events changed in last 10 days. you can use range e.g. "14d,7d"
example2 = | mispgetevent misp_instance=misp timestamp=10d category="Payload delivery,Network%" type=ip-dst
comment2 = Retrieve events edited in last 10 days with attributes of type 'ip-dst' and categories 'Payload delivery' or starting by 'Network'.
example3 = | mispgetevent misp_instance=misp eventid="123,124,678"
comment3 = Retrieve event with id 123, 124 & 678. you can mix id and uuid.
example4 = | mispgetevent misp_instance=misp publish_timestamp="14d,7d"
comment4 = Retrieve events published between last 14 and 7 days.
related = mispgetioc, mispfetch, misprest
tags = misp

[mispgetevent-options]
syntax = misp_instance=<string> json_request=<JSON> date=<YYYY-MM-DD[,YYYY-MM-DD]> eventid=<id1,id2,...> \
  last=<int>d|h|m publish_timestamp=<int>d|h|m timestamp=<int>d|h|m \
  category=<CSV string> exclude_local_tags=<bool> expand_object=<bool> getioc=<bool> include_sightings=<bool> \
  keep_galaxy=<bool> keep_related=<bool> limit=<int> not_tags=<CSV string> output=<fields|json> page=<int> \
  pipesplit=<bool> prefix=<string> published=<bool> tags=<CSV string> threat_level_id=<int> to_ids=<bool> \
  type=<CSV string> warning_list=<bool>


##################
# mispfetch
##################
[mispfetch-command]
syntax = | mispfetch <mispfetch-options> 
shortdesc = Streaming command to retrieve events or attributes from MISP instance and append to current dataset.
description = mispfetch is a streaming command that pulls events and/or attributes from MISP instance and appends them to the current dataset.\
  Unlike mispgetioc and mispgetevent, mispfetch can dynamically build queries from SPL fields.\
  Define your MISP instance as input. Limit is set by default to 1000.\
  You can filter on "category" or "type" of attributes, or specific "tags" or not having "not_tags".\
  To return attribute values when searching MISP events, use getioc=true.\
  To split multivalue attributes into separate fields set pipesplit=true.
usage = public
example1 = | makeresults | eval misp_instance="misp" | mispfetch getioc=true limit=100 attribute_limit=1000
comment1 = Retrieve up to 100 events published in last 1 hour (default). For each MISP event, return up to 1000 attributes.
example2 = | makeresults | eval misp_instance="misp", last="7d", published=true | tojson last, published output_field=misp_http_body | mispfetch
comment2 = Retrieve published events from the last 7 days using a dynamically built request body.
example3 = | makeresults | eval misp_instance="misp", misp_restsearch="attributes" | mispfetch limit=500
comment3 = Retrieve attributes instead of events using the /attributes/restSearch endpoint.
related = mispgetioc, mispgetevent, mispsearch
tags = misp

[mispfetch-options]
syntax = misp_instance=<string> misp_restsearch=<events|attributes> misp_http_body=<JSON> misp_output_mode=<fields|json> \
  attribute_limit=<int> expand_object=<bool> getioc=<bool> keep_galaxy=<bool> keep_related=<bool> limit=<int> \
  not_tags=<CSV string> page=<int> pipesplit=<bool> prefix=<string> tags=<CSV string>


##################
# mispsearch
##################
[mispsearch-command]
syntax = mispsearch <mispsearch-options>
shortdesc = Search in MISP for attributes having the value of specified field.
description = mispsearch is a streaming command that searches MISP for attributes matching the value of a specified field.\
  Results are merged into the existing record with MISP attribute metadata.
usage = public
example1 = | mispsearch misp_instance=misp field=clientip prefix="misp_dev_"
comment1 = Retrieve attributes properties (attribute uuid, event_id, type, category, to_ids flag) for matching values of field clientip.
example2 = ... | fields ip | mispsearch misp_instance=misp field=ip misp_http_body="{\"returnFormat\": \"json\", \"withAttachments\": false, \"includeEventUuid\": true, \"includeEventTags\": true}"
comment2 = Use a JSON request body for customised search (it is simpler to prepare a field misp_http_body before calling mispsearch).
related = mispgetioc, mispfetch, mispgetattribute
tags = misp

[mispsearch-options]
syntax = misp_instance=<string> field=<fieldname> misp_http_body=<JSON> \
  limit=<int> not_tags=<CSV string> page=<int> pipesplit=<bool> prefix=<string> tags=<CSV string>


##################
# misprest
##################
[misprest-command]
syntax = | misprest <misprest-options> 
shortdesc = Generic wrapper to call any MISP REST API endpoint.
description = misprest is a versatile command that wraps any MISP REST API call.\
  Provide the misp_instance, HTTP method, target endpoint, and optional JSON request body.
usage = public
example1 = | misprest misp_instance=misp method=GET target="/servers/getVersion"
comment1 = Retrieve MISP server version.
example2 = | misprest misp_instance=misp method=POST target="/attributes/restSearch" json_request="{\"returnFormat\": \"json\", \"last\": \"20d\"}"
comment2 = Retrieve MISP attributes of all events published in last 20 days and display as events.
example3 = | misprest misp_instance=misp method=GET target="/tags"
comment3 = Retrieve all tags from MISP instance.
related = mispgetioc, mispgetevent, mispfetch
tags = misp

[misprest-options]
syntax = misp_instance=<string> method=<DELETE|GET|POST|PUT> target=<string> json_request=<JSON>


##################
# mispgetattribute
##################
[mispgetattribute-command]
syntax = mispgetattribute <mispgetattribute-options>
shortdesc = Retrieve a single attribute by ID from MISP.
description = mispgetattribute is a streaming command that retrieves details for a single MISP attribute.\
  The attribute ID is read from a specified field in each record.
usage = public
example1 = | makeresults | eval attr_id=1234 | mispgetattribute misp_instance=misp attributeid=attr_id
comment1 = Returns all fields of the attribute with id in field attr_id (1234).
example2 = | makeresults | eval attr_id=1234 | mispgetattribute misp_instance=misp attributeid=attr_id output_filter="event_id,deleted,type,value"
comment2 = Returns only event_id, deleted, type and value fields of the attribute with id in field attr_id.
related = mispsearch, mispgetioc
tags = misp

[mispgetattribute-options]
syntax = misp_instance=<string> attributeid=<fieldname> output_filter=<CSV string> prefix=<string>
